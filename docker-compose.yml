services:
  api-proxy:
    build: .
    restart: unless-stopped
    ports:
      - "3030:3030"
    environment:
      RUST_LOG: info
    volumes:
      - ./config.yaml:/etc/api-proxy/config.yaml:ro
      # Persist the generated local CA and server certificate.
      - ./tls:/tls
      # Optional private CA bundle. Uncomment this and set ca_bundle_path in
      # config.yaml when the target is signed by a private CA.
      # - ./custom-ca-bundle.pem:/etc/ssl/certs/custom-ca-bundle.pem:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
