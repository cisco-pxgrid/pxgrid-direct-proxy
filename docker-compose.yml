services:
  api-proxy:
    build: .
    ports:
      - "3030:3030"
    # env_file:
    #   - .env
    environment:
      RUST_LOG: info
      SERVICENOW_USERNAME: ${SERVICENOW_USERNAME}
      SERVICENOW_PASSWORD: ${SERVICENOW_PASSWORD}
    volumes:
      - ./config.yaml:/etc/api-proxy/config.yaml:ro
      # Optional private CA bundle. Uncomment this and set ca_bundle_path in
      # config.yaml when the target is signed by a private CA.
      # - ./custom-ca-bundle.pem:/etc/ssl/certs/custom-ca-bundle.pem:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
